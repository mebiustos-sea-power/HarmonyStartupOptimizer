[Language_en]
Name=Harmony Startup Optimizer
Description=Speeds up repeated Harmony type lookups across mods using a shared memory cache. Requires Anchor Chain. Enable this mod, then restart Sea Power. Disable BDCM Startup Optimizer when comparing performance.

[Language_ja]
Name=Harmony Startup Optimizer
Description=Harmonyの型探索結果をMOD共通のメモリキャッシュで再利用し、起動を高速化します。Anchor Chainが必要です。有効にした後、Sea Powerを再起動してください。効果の比較時はBDCM Startup Optimizerを無効にしてください。
